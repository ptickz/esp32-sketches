; Shared settings for all sketches in this repo.
; Projects pull this in with `extra_configs = ../common.ini` and `extends = esp32_common`.
; If the board shows up on a different port, change it here once.

[esp32_common]
platform = espressif32 @ ^8.0.0
board = esp32dev
framework = arduino

upload_port = /dev/cu.usbserial-0001
upload_speed = 115200

monitor_port = /dev/cu.usbserial-0001
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
